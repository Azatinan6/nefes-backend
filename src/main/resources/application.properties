# ===== VERİTABANI BAĞLANTISI =====
# PostgreSQL veritabanı bağlantı bilgileri
spring.application.name=nefes
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nefes_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate — şema değişikliklerini otomatik uygula (geliştirme ortamı için)
# PROD: Bu değer "validate" olarak değiştirilmeli!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== YAPAY ZEKA (GEMİNİ) KONFİGÜRASYONU =====
# Gemini AI API erişim bilgileri — raporlar için kullanılır
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent

# ===== JWT GÜVENLİK KONFİGÜRASYONU =====
# Token imzalama anahtarı — PROD ortamında güçlü, rastgele bir değerle değiştir!
# En az 32 karakter olmalı (256 bit güvenlik)
jwt.secret=${JWT_SECRET:NefesAI2026GizliAnahtar_Degistir_Production!@#}
# Token geçerlilik süresi — milisaniye cinsinden (86400000 = 24 saat)
jwt.expiration=86400000

# ===== E-POSTA KONFİGÜRASYONU =====
# Gmail SMTP ayarları — "Şifremi Unuttum" ve onay bildirimleri için
# KULLANIM: Gmail hesabında "Uygulama Şifresi" (App Password) oluştur
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:nefes.bildirim@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== UYGULAMA AYARLARI =====
# Frontend URL'si — e-postalardaki bağlantılar için (PROD: gerçek domain)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}